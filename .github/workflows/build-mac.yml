# 在 macOS 上构建 limitPro 的 macOS 安装包
#
# 为什么必须有这个 workflow：
#   macOS 的 dmg 制作依赖 hdiutil、代码签名依赖 codesign、公证依赖 notarytool，
#   三者都只存在于 macOS。在 Windows / Linux 上无论怎么配都打不出 mac 包
#   （electron-builder 会直接拒绝：Build for macOS is supported only on macOS）。
#   所以把构建放到 GitHub 的 macOS runner 上，是「手上没有 Mac」时最省事的方案。
#
# 用法：
#   1. 把仓库推到 GitHub；
#   2. Actions → Build macOS installer → Run workflow（或推一个 v* 标签）；
#   3. 构建完成后在该次运行的 Artifacts 里下载 limitPro-macos（含 arm64 / x64 两种 dmg）。
#
# 关于签名：本项目目前不签名（package.json 里 mac.identity = "-"，即 ad-hoc 自签名）。
#   这样打出来的包能在这台机器上直接运行，但从网上下载后第一次打开会被 Gatekeeper 拦一次，
#   需要右键「打开」或执行 `xattr -dr com.apple.quarantine /Applications/limitPro.app`。
#   等拿到 Apple 开发者账号后，把 mac.identity 改成证书名并配置 CSC_LINK 即可自动签名 + 公证。

name: Build macOS installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-mac:
    # macos-14 是 Apple Silicon 机器；electron-builder 可以在这里同时打出 arm64 与 x64 两个包
    runs-on: macos-14
    timeout-minutes: 45

    env:
      # 明确禁止 electron-builder 去钥匙串里找 Apple 证书，走配置里的 ad-hoc 签名。
      # 不设置的话，如果 runner 上恰好有证书，会尝试真签名并失败。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建并打包（arm64 + x64）
        run: pnpm dist:mac

      - name: 校验签名与架构
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/limitPro.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "✗ 没有找到任何 .app 产物"; exit 1
          fi
          for app in "${apps[@]}"; do
            echo "── $app"
            # ad-hoc 签名必须能通过严格校验，否则 macOS 会判「已损坏」
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -info "$app/Contents/MacOS/limitPro"
            asar=$(stat -f%z "$app/Contents/Resources/app.asar")
            echo "app.asar = $asar 字节"
            # 回归防线：build.files 里的 !node_modules/**/* 一旦被删掉，
            # asar 会从 ~10KB 涨到几百 MB，这里直接拦住
            if [ "$asar" -gt 1048576 ]; then
              echo "✗ app.asar 过大（$asar 字节），检查 package.json 的 build.files 是否还有 !node_modules/**/*"
              exit 1
            fi
          done
          echo "✓ 签名、架构、asar 体积均正常"

      - name: 冒烟验证（真的把打包后的服务端跑起来）
        run: |
          set -euo pipefail
          shopt -s nullglob

          APP=""
          for candidate in release/mac-arm64/limitPro.app release/mac*/limitPro.app; do
            if [ -d "$candidate" ]; then APP="$candidate"; break; fi
          done
          if [ -z "$APP" ]; then echo "✗ 没有找到 .app 产物"; exit 1; fi

          BIN="$APP/Contents/MacOS/limitPro"
          ENTRY="$APP/Contents/Resources/app/.next/standalone/server.js"
          if [ ! -f "$ENTRY" ]; then echo "✗ 找不到 $ENTRY"; exit 1; fi

          PORT=3399
          LOG="$RUNNER_TEMP/server.log"

          # 先把工作目录切到 standalone 目录，再后台启动：
          # 这样 $! 拿到的就是服务进程本身的 pid，kill 才杀得准（放子 shell 里会只杀到子 shell）。
          pushd "$(dirname "$ENTRY")" >/dev/null
          ELECTRON_RUN_AS_NODE=1 NODE_ENV=production PORT=$PORT HOSTNAME=127.0.0.1 \
            LIMITPRO_DATA_DIR="$RUNNER_TEMP/lpdata" "$BIN" "$ENTRY" > "$LOG" 2>&1 &
          SRV=$!
          popd >/dev/null
          trap 'kill $SRV 2>/dev/null || true' EXIT

          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" -o "$RUNNER_TEMP/health.json"; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "✗ 后端未就绪，日志："; cat "$LOG"; exit 1
          fi

          echo "── /api/health"; cat "$RUNNER_TEMP/health.json"; echo
          grep -q '"ok":true' "$RUNNER_TEMP/health.json" || { echo "✗ health 未返回 ok"; exit 1; }

          echo "── GET /"
          curl -fsS "http://127.0.0.1:$PORT/" | grep -o '<title>[^<]*</title>' || { echo "✗ 首页标题异常"; exit 1; }

          echo "✓ 打包产物可正常运行"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: limitPro-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
